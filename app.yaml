name: isa-conciliia-web-site
static_sites:
  - name: isa-conciliia-web-site
    github:
      repo: mnatrimind/website-isa-v1
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm run build
    output_dir: out
    error_document: 404.html
    envs:
      - key: NEXT_PUBLIC_API_URL
        value: https://app.isaconcilia.com.br
        scope: BUILD_TIME
      - key: NEXT_PUBLIC_PRICING_API_URL
        value: https://app.isaconcilia.com.br/api/public/plans
        scope: BUILD_TIME
      - key: NEXT_PUBLIC_APP_URL
        value: https://app.isaconcilia.com.br
        scope: BUILD_TIME
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
        scope: BUILD_TIME
domains:
  - domain: isaconcilia.com.br
    type: PRIMARY
  - domain: www.isaconcilia.com.br
    type: ALIAS
